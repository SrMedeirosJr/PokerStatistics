[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-range-helper"
version = "0.1.0"
description = "API de ranges push/fold (Nash aproximado, chipEV) e equity para MTT."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    # eval7 só publica wheels até o CPython 3.12; acima disso usamos o fallback.
    "eval7>=0.1.10; python_version < '3.13'",
    "phevaluator>=0.5.3; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Starlette >= 1.x usa httpx2 no TestClient (httpx está depreciado ali).
    "httpx2>=2.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
